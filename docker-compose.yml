services:
  english-grammar:
    image: ghcr.io/lu8010252/english-grammar:latest
    container_name: english-grammar
    restart: unless-stopped
    ports:
      - "8092:8092"          # 左边是对外端口，按需修改
    environment:
      - TZ=Asia/Shanghai
      - ADMIN_PIN=           # 家长密码：留空=不设；设置后「清除数据/删除学习者/导入备份」需要输入
    volumes:
      - ./data:/data         # 学习数据（data.json），备份只需复制这个目录
